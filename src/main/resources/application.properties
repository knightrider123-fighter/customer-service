# =========================================================
# APPLICATION CONFIGURATION
# =========================================================

# Application name
spring.application.name=customerservice


# =========================================================
# SERVER CONFIGURATION
# =========================================================

# Port on which the Spring Boot application will run
server.port=8080

# Base context path for all APIs (optional)
# Example: http://localhost:8080/api/customers
# server.servlet.context-path=/api


# =========================================================
# H2 DATABASE CONFIGURATION
# =========================================================

# H2 in-memory database
# The database will be created when the application starts
# and will be removed when the application stops.
spring.datasource.url=jdbc:h2:file:./data/customerDb

# H2 database username
spring.datasource.username=sa

# H2 database password
spring.datasource.password=

# H2 JDBC driver
spring.datasource.driver-class-name=org.h2.Driver


# =========================================================
# H2 CONSOLE CONFIGURATION
# =========================================================

# Enable H2 browser console
spring.h2.console.enabled=true

# URL path for H2 console
# Open: http://localhost:8080/h2-console
spring.h2.console.path=/h2-console

# Allows H2 console to work with Spring Security
# only if your security configuration permits it.
# spring.h2.console.settings.web-allow-others=true


# =========================================================
# JPA / HIBERNATE CONFIGURATION
# =========================================================

# Automatically create/update database tables
#
# update  -> Creates missing tables and updates schema
# create  -> Drops and recreates tables every startup
# create-drop -> Creates tables at startup and drops at shutdown
# validate -> Only validates existing schema
# none -> No automatic schema modification
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in the console
spring.jpa.show-sql=true

# Format SQL queries for better readability
spring.jpa.properties.hibernate.format_sql=true

# Optional: show SQL parameters
# spring.jpa.properties.hibernate.highlight_sql=true


# =========================================================
# JPA TRANSACTION / OPEN SESSION CONFIGURATION
# =========================================================

# Prevent lazy-loading queries from being executed
# automatically from the web layer.
spring.jpa.open-in-view=false


# =========================================================
# H2 / HIBERNATE DIALECT
# =========================================================

# Hibernate dialect for H2 database
# Usually Hibernate can detect this automatically.
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect


# =========================================================
# LOGGING CONFIGURATION
# =========================================================

# Application log level
logging.level.root=INFO

# Show Spring Web logs
logging.level.org.springframework.web=INFO

# Show Hibernate SQL logs
logging.level.org.hibernate.SQL=DEBUG

# Show Hibernate parameter binding logs
# Useful while debugging SQL queries.
# logging.level.org.hibernate.orm.jdbc.bind=TRACE


# =========================================================
# SPRING SECURITY
# =========================================================

# Default Spring Security user
# Useful only for basic Spring Security testing.
#
# If you create your own UserDetailsService / SecurityFilterChain,
# these properties may not be required.

spring.security.user.name=admin
spring.security.user.password=admin123

# Roles assigned to the default user
spring.security.user.roles=ADMIN


# =========================================================
# VALIDATION
# =========================================================

# Show validation-related messages
logging.level.org.springframework.validation=DEBUG


# =========================================================
# DEVELOPMENT SETTINGS
# =========================================================

# Disable Thymeleaf cache if you later use Thymeleaf
# spring.thymeleaf.cache=false


# =========================================================
# ACTUATOR (OPTIONAL)
# =========================================================

# If you later add spring-boot-starter-actuator:
#
# management.endpoints.web.exposure.include=health,info
# management.endpoint.health.show-details=always
